name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'
          cache-provider: basic

      - name: Read release version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must look like v1.2.3 (optionally with a prerelease/build suffix). Got: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build release
        run: gradle clean build --no-daemon -Pmod_version="${{ steps.version.outputs.version }}"

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          sha256sum "build/libs/binary-skies-${{ steps.version.outputs.version }}.jar" > "build/libs/binary-skies-${{ steps.version.outputs.version }}.jar.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: Binary Skies ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: false
          overwrite_files: true
          files: |
            build/libs/binary-skies-${{ steps.version.outputs.version }}.jar
            build/libs/binary-skies-${{ steps.version.outputs.version }}-sources.jar
            build/libs/binary-skies-${{ steps.version.outputs.version }}.jar.sha256
